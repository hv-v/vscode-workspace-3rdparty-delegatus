# Workspace configuration for jo-workspace.
# Model, reasoning effort, and service tier inherit from ~/.codex/config.toml.
# Reference: https://learn.chatgpt.com/docs/config-file/config-basic

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

# Docker-hosted codebase memory; port 9749 is the graph UI, not MCP.
[mcp_servers.codebase-memory]
command = "/home/vhaponov/Documents/jo-workspace/docker/cbm/cbm.sh"
args = ["serve-mcp"]
cwd = "/home/vhaponov/Documents/jo-workspace"
startup_timeout_sec = 30
tool_timeout_sec = 120
