# tinyproxy for the Delegatus container.
#
# Allows only CONNECT to port 443 of a host matched by a line in `allow`.
# Anything else (another port, another host, plain HTTP to an unlisted host)
# is refused. The proxy publishes no port: it is reachable only from the
# isolated network the Delegatus container sits on.

Port 3128
Listen 0.0.0.0
Timeout 900
MaxClients 64

# Tunnels only to 443; no plain-text relay beyond the allow-list.
ConnectPort 443

# Default deny: a host passes only if a line in `allow` matches it.
FilterDefaultDeny Yes
FilterType ERE
FilterURLs No
Filter "/etc/tinyproxy/allow"

DisableViaHeader Yes
LogLevel Connect
